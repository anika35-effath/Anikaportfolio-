<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="violetRoseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0a0812"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Card Frame -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bgGrad)" stroke="url(#violetRoseGrad)" stroke-width="2.5"/>
  
  <!-- Terminal Header Dots -->
  <circle cx="14" cy="14" r="2.5" fill="#f43f5e"/>
  <circle cx="21" cy="14" r="2.5" fill="#fbbf24"/>
  <circle cx="28" cy="14" r="2.5" fill="#34d399"/>
  
  <!-- Glowing Code Symbol EA (Effath Anika) / Terminal Prompt -->
  <path d="M16 28 L27 37 L16 46" stroke="url(#violetRoseGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="32" y1="46" x2="48" y2="46" stroke="#fb7185" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
</svg>