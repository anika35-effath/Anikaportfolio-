<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" fill="none">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1838"/>
      <stop offset="100%" stop-color="#0e0b19"/>
    </linearGradient>
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a204a"/>
      <stop offset="100%" stop-color="#191330"/>
    </linearGradient>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="280" height="280" rx="36" fill="url(#avatarBg)"/>
  <rect x="6" y="6" width="268" height="268" rx="30" stroke="url(#neonRing)" stroke-width="2.5" filter="url(#ringGlow)" stroke-dasharray="600" stroke-dashoffset="0"/>

  <!-- Code Grid / Constellation Backdrop -->
  <circle cx="50" cy="50" r="1.5" fill="#a855f7" opacity="0.6"/>
  <circle cx="230" cy="60" r="1.5" fill="#f43f5e" opacity="0.6"/>
  <circle cx="220" cy="220" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="60" cy="210" r="1.5" fill="#c084fc" opacity="0.6"/>

  <!-- Developer Silhouette with Tech Headphones & Aesthetic Glasses -->
  <!-- Neck -->
  <path d="M125 160 L155 160 L158 190 L122 190 Z" fill="#e2c8b8"/>
  
  <!-- Shoulders / Hoodie -->
  <path d="M60 260 C65 205, 110 190, 140 190 C170 190, 215 205, 220 260 Z" fill="url(#jacketGrad)" stroke="#a855f7" stroke-width="1.5"/>
  <!-- Hoodie Collar Accent -->
  <path d="M110 190 L140 230 L170 190" stroke="#f43f5e" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Head / Hair Silhouette -->
  <!-- Long Flowing Hair Back -->
  <path d="M85 110 C85 60, 195 60, 195 110 C195 165, 205 210, 200 230 C190 235, 175 220, 175 200 C175 160, 105 160, 105 200 C105 220, 90 235, 80 230 C75 210, 85 165, 85 110 Z" fill="#140f24"/>

  <!-- Face -->
  <path d="M105 110 C105 85, 175 85, 175 110 C175 145, 160 168, 140 168 C120 168, 105 145, 105 110 Z" fill="#fad7bd"/>

  <!-- Hair Bangs Front -->
  <path d="M96 100 C110 82, 140 80, 145 98 C155 80, 180 85, 184 105 C170 95, 155 98, 148 108 C140 92, 115 90, 96 100 Z" fill="#201836"/>

  <!-- Modern Tech Glasses (Rose Neon Glow) -->
  <rect x="110" y="112" width="24" height="15" rx="4" fill="rgba(244,63,94,0.15)" stroke="#fb7185" stroke-width="2"/>
  <rect x="146" y="112" width="24" height="15" rx="4" fill="rgba(244,63,94,0.15)" stroke="#fb7185" stroke-width="2"/>
  <line x1="134" y1="118" x2="146" y2="118" stroke="#fb7185" stroke-width="2"/>

  <!-- Developer Over-Ear Headphones (Violet Metallic) -->
  <path d="M92 110 C85 110, 85 130, 92 130 Z" fill="#a855f7" stroke="#c084fc" stroke-width="2"/>
  <path d="M188 110 C195 110, 195 130, 188 130 Z" fill="#a855f7" stroke="#c084fc" stroke-width="2"/>
  <path d="M92 115 C92 70, 188 70, 188 115" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>

  <!-- Subtle Badge Code Monogram -->
  <g transform="translate(140, 245)">
    <rect x="-35" y="-12" width="70" height="24" rx="12" fill="#120e24" stroke="#a855f7" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">&lt;EA /&gt;</text>
  </g>
</svg>